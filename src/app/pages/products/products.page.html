<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Buy Coffee</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/cart" aria-label="Open cart" class="cart-anchor">
        <ion-icon slot="icon-only" name="cart"></ion-icon>
        @if (cartCount() > 0) {
          <span class="cart-badge">{{ cartCount() > 99 ? '99+' : cartCount() }}</span>
        }
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="products-page">
    <div class="products-intro bb-rise">
      <div class="intro-text">
        <h2>Our Menu</h2>
        <p>Browse, search and filter our newest brews.</p>
      </div>
      <ion-icon name="cafe"></ion-icon>
    </div>

    <app-product-grid [filterable]="true"></app-product-grid>
  </div>
</ion-content>
