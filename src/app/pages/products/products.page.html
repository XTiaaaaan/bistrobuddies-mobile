<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Buy Coffee</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/cart" aria-label="Open cart">
        <ion-icon slot="icon-only" name="cart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Buy Coffee</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="products-page">
    <div class="products-intro">
      <div class="intro-text">
        <h2>Buy Coffee</h2>
        <p>Our newest brews, listed from most recently added.</p>
      </div>
      <ion-icon name="cafe"></ion-icon>
    </div>

    <app-product-grid></app-product-grid>
  </div>
</ion-content>
