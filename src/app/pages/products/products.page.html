<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Buy Coffee</ion-title>
    <app-header-cart-button slot="end"></app-header-cart-button>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content
      pullingText="Pull to refresh"
      refreshingText="Refreshing..."
    ></ion-refresher-content>
  </ion-refresher>

  <div class="products-page">
    <div class="products-intro bb-rise">
      <div class="intro-text">
        <h2>Our Menu</h2>
        <p>Browse our newest brews.</p>
      </div>
      <ion-icon name="cafe"></ion-icon>
    </div>

    <app-product-grid [filterable]="true"></app-product-grid>
  </div>
</ion-content>
