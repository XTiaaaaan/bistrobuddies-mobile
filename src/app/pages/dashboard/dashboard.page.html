<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>BistroBuddies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content
      pullingText="Pull to refresh"
      refreshingText="Refreshing..."
    ></ion-refresher-content>
  </ion-refresher>

  <div class="home-page">
    <section class="brand-hero bb-rise">
      <img
        class="brand-logo"
        src="assets/BistroBuddiesLogo.png"
        alt="BistroBuddies logo"
      />
      <div class="brand">
        <span class="brand-bistro">Bistro</span>
        <span class="brand-buddies">Buddies</span>
      </div>
      <p class="brand-tagline">COFFEE SHOP</p>

      @if (customerName(); as name) {
        <p class="welcome">Welcome back, {{ name }}!</p>
      } @else {
        <p class="welcome">Welcome to BistroBuddies!</p>
      }

      @if (!signedIn()) {
        <ion-button class="sign-in-button" fill="outline" routerLink="/login">
          Sign In to Order
        </ion-button>
      }
    </section>

    <nav class="quick-actions" aria-label="Quick actions">
      <a class="quick-action" routerLink="/my-orders">
        <span class="quick-icon"><ion-icon name="receipt" aria-hidden="true"></ion-icon></span>
        <span class="quick-label">My Orders</span>
        <ion-icon
          class="quick-chevron"
          aria-hidden="true"
          ios="chevron-forward-outline"
          md="chevron-forward-sharp"
        ></ion-icon>
      </a>
    </nav>

    <div class="section-head">
      <div class="section-text">
        <h2>Latest Coffee</h2>
        <p>Fresh drinks added most recently.</p>
      </div>
      <ion-icon name="cafe"></ion-icon>
    </div>

    <app-product-grid [availableOnly]="true" [limit]="6"></app-product-grid>
  </div>
</ion-content>
